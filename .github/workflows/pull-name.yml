name: Title Format (Pull Request)

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - reopened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prTitle:
    name: Check
    if: github.repository == 'pixijs/3d'
    runs-on: namespace-profile-linux-8-16
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check PR Title
        uses: actions/github-script@v8
        with:
          script: |
            const mod = await import('${{ github.workspace }}/.github/scripts/check-pr-title.ts');
            await mod.default({ github, context, core });
