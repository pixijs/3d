name: Sync Skills

# One-way sync of the skills in `skills/` to pixijs/pixijs-skills, the mirror
# pixi.js syncs its own skills to. On every published GitHub release, each
# skill folder is read from the release tag and replaces the folder of the same
# name in the mirror, keeping it in lockstep with the npm package (which
# bundles skills/ at the same tag). Prereleases sync too while @pixi/3d ships
# only betas; once it has a stable release, add pixi.js's prerelease filter.
#
# Only this repo's skill folders are replaced: the mirror holds pixi.js's
# skills beside them, and keeps its own README, plugin configs and assets.
# A skill deleted here must be deleted in the mirror by hand.
#
# Use workflow_dispatch for manual / out-of-band syncs (e.g. an urgent skill
# fix from main ahead of a release); source_ref defaults to main there.
#
# Auth: the GitHub App pixi.js uses (installed on pixijs/pixijs-skills with
# `contents: write`) mints a short-lived token per run. Requires two
# repository or organization secrets:
#   SKILLS_SYNC_APP_ID          - the App's numeric ID
#   SKILLS_SYNC_APP_PRIVATE_KEY - the App's private key (.pem contents)
#
# The target branch (default `main`) must already exist in pixijs-skills;
# the checkout step fails fast if the ref is not found.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Ref in this repo to read skills/ from (tag or branch)'
        required: false
        default: 'main'
      target_ref:
        description: 'Branch in pixijs-skills to sync into'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: namespace-profile-linux-8-16
    env:
      TARGET_REPO: pixijs/pixijs-skills
      SOURCE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.source_ref || 'main' }}
      TARGET_REF: ${{ github.event.inputs.target_ref || 'main' }}
    steps:
      - name: Validate refs
        run: |
          for ref in "${SOURCE_REF}" "${TARGET_REF}"; do
            if ! [[ "${ref}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${ref}" == -* ]]; then
              echo "Invalid ref: ${ref}"
              exit 1
            fi
          done

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SKILLS_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: pixijs
          repositories: pixijs-skills

      - name: Checkout this repo (source)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pixijs-skills (target)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 1

      - name: Replace this repo's skill folders
        run: |
          mkdir -p target/skills
          for dir in source/skills/*/; do
            name="$(basename "${dir}")"
            rm -rf "target/skills/${name}"
            cp -R "source/skills/${name}" "target/skills/${name}"
          done

      - name: Detect changes
        id: diff
        working-directory: target
        run: |
          if [[ -z "$(git status --porcelain skills)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # pixi.js pushes to the same branch, so rebase onto its sync if one landed meanwhile.
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        env:
          SOURCE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          SYNC_SHA="$(git -C "${GITHUB_WORKSPACE}/source" rev-parse HEAD)"
          git config user.name "${ACTOR}"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git add skills
          git commit -m "chore: sync skills from ${SOURCE_REPO}@${SOURCE_REF} (${SYNC_SHA:0:7})

          Source: https://github.com/${SOURCE_REPO}/commit/${SYNC_SHA}"
          for attempt in 1 2 3; do
            git push origin "HEAD:${TARGET_REF}" && exit 0
            git pull --rebase origin "${TARGET_REF}"
          done
          exit 1
