name: Release

# Every mirror sync drafts a release with the packed tarball attached, so beta
# testers always have a current `npm install`-able build to download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  tarball:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - name: Pack
        id: pack
        run: |
          file=$(npm pack --silent)
          version=$(node -p "require('./package.json').version")
          # The sync commit names the pixi-3d commit it mirrors; that sha is the
          # one worth quoting, since a mirror sha maps to nothing upstream.
          sha=$(git log -1 --pretty=%s | sed -n 's/.*sync pixi-3d@\([0-9a-f]\{7,\}\).*/\1/p')
          sha=${sha:-${GITHUB_SHA::7}}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=beta-$version-$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
          TAG: ${{ steps.pack.outputs.tag }}
          VERSION: ${{ steps.pack.outputs.version }}
          SHA: ${{ steps.pack.outputs.sha }}
        run: |
          # Re-running the workflow on the same commit replaces the draft.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          cat > notes.md <<EOF
          Closed beta build of \`@pixi/3d\` from commit \`$SHA\`.

          Download \`$FILE\`, then install it next to PixiJS:

          \`\`\`sh
          npm install pixi.js
          npm install ./$FILE
          \`\`\`

          Imports work exactly as they will from npm:

          \`\`\`ts
          import { View3D } from '@pixi/3d';
          import { OrbitCamera } from '@pixi/3d/extras';
          \`\`\`
          EOF
          gh release create "$TAG" "$FILE" \
            --draft \
            --title "Beta $VERSION ($SHA)" \
            --notes-file notes.md
